<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boba Bonh Mi Bros</title>
    <meta name="description" content="Compare AVI, the Pabrai composite, each PIF fund, and SPY across a fixed five-year window.">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <div class="brand-row">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 190 110" role="presentation">
                <defs>
                  <linearGradient id="cupTea" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#d89a5f"></stop>
                    <stop offset="100%" stop-color="#9c5d2e"></stop>
                  </linearGradient>
                  <linearGradient id="breadTone" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f0c46d"></stop>
                    <stop offset="100%" stop-color="#cc8f42"></stop>
                  </linearGradient>
                </defs>
                <ellipse cx="94" cy="55" rx="88" ry="44" fill="#fff7eb" stroke="#d5c2aa" stroke-width="2"></ellipse>
                <path d="M37 16h9l10 22H45z" fill="#28211a"></path>
                <path d="M21 35h50l-7 43c-1.4 9.4-9.5 16.3-19 16.3h-0.3c-9.5 0-17.6-6.9-19-16.3z" fill="#f5ead9" stroke="#5a4937" stroke-width="3.4"></path>
                <path d="M24 46h44l-5 29.5c-0.9 6.5-6.5 11.3-13.1 11.3H42c-6.6 0-12.1-4.8-13.1-11.3z" fill="url(#cupTea)"></path>
                <circle cx="36" cy="75" r="4.4" fill="#2c211b"></circle>
                <circle cx="48" cy="81" r="4.4" fill="#2c211b"></circle>
                <circle cx="59" cy="74" r="4.4" fill="#2c211b"></circle>
                <circle cx="44" cy="67" r="3.8" fill="#2c211b"></circle>
                <circle cx="54" cy="66" r="3.8" fill="#2c211b"></circle>
                <path d="M15 35h62" stroke="#5a4937" stroke-width="3.4" stroke-linecap="round"></path>
                <path d="M95 50c0-18 17-31 45-31 31 0 47 13 47 30 0 16-17 28-45 28-31 0-47-10-47-27z" fill="url(#breadTone)" stroke="#7d5a34" stroke-width="3.4"></path>
                <path d="M102 55c4 12 18 18 40 18 20 0 32-5 39-15-7 1.9-14.6 2.8-23 2.8h-34.8c-8 0-15.1-1.9-21.2-5.8z" fill="#f7d898"></path>
                <path d="M110 46c8 6.2 20 10 34 10 14 0 30-3.2 39-10" stroke="#fff9ef" stroke-width="5.6" stroke-linecap="round"></path>
                <path d="M116 45c0 0 5-8 10-8 5 0 8 6 12 6s7-7 12-7c5 0 7 7 13 7s8-6 13-6" stroke="#3d8a58" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M121 51c7 0 12-7 18-7 5 0 10 6 15 6 6 0 9-5 14-5 5 0 11 5 17 5" stroke="#d45a39" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M124 39c8-6 19-9 35-9" stroke="#f3c355" stroke-width="4" stroke-linecap="round"></path>
                <path d="M112 31l3 7M128 26l3 8M147 24l2.6 8M164 28l2.6 8" stroke="#97673a" stroke-width="2.8" stroke-linecap="round"></path>
              </svg>
            </div>
            <div class="brand-copy">
              <p class="eyebrow">Five-year comparison lab</p>
              <h1>Boba Bonh Mi Bros</h1>
            </div>
          </div>
          <p id="subtitle" class="subtitle"></p>
        </div>
        <aside class="hero-side">
          <article class="hero-panel">
            <span class="hero-label">Window</span>
            <strong id="window-range"></strong>
            <span class="hero-note">Fixed comparison span</span>
          </article>
          <article class="hero-panel">
            <span class="hero-label">Compare stack</span>
            <strong id="compare-count"></strong>
            <span id="benchmark-name" class="hero-note"></span>
          </article>
        </aside>
      </header>

      <section class="focus-strip" aria-label="Focus view">
        <div class="focus-copy">
          <span class="section-eyebrow">Focus view</span>
          <h2>Change the detail panel without losing your compare stack</h2>
        </div>
        <div id="focus-tabs" class="focus-tabs" role="tablist" aria-label="Dashboard views"></div>
      </section>

      <main id="dashboard-root" class="dashboard-root">
        <section class="loading-card">
          <p>Loading comparison lab...</p>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
